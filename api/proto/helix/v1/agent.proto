syntax = "proto3";

package helix.v1;

import "api/proto/helix/v1/common.proto";

option go_package = "github.com/yamaankhan20/helixctl/gen/proto/helix/v1;helixv1";

service AgentService {
  rpc RunContainer(RunContainerRequest) returns (RunContainerResponse);
  rpc StopContainer(StopContainerRequest) returns (StopContainerResponse);
  rpc RemoveContainer(RemoveContainerRequest) returns (RemoveContainerResponse);
  rpc InspectContainer(InspectContainerRequest) returns (InspectContainerResponse);
  rpc ListContainers(ListContainersRequest) returns (ListContainersResponse);
  rpc ApplyRoutes(ApplyRoutesRequest) returns (ApplyRoutesResponse);
}

message RunContainerRequest {
  string request_id = 1;
  string container_id = 2;
  string workload_id = 3;
  uint64 generation = 4;
  string rootfs = 5;
  repeated string command = 6;
  Resources resources = 7;
}

message RunContainerResponse {
  string container_id = 1;
  ContainerState state = 2;
  int32 pid = 3;
  string ip = 4;
  string message = 5;
}

message StopContainerRequest {
  string container_id = 1;
}

message StopContainerResponse {
  string container_id = 1;
}

message RemoveContainerRequest {
  string container_id = 1;
}

message RemoveContainerResponse {
  string container_id = 1;
}

message InspectContainerRequest {
  string container_id = 1;
}

message InspectContainerResponse {
  string container_id = 1;
  string workload_id = 2;
  string node_id = 3;
  int32 pid = 4;
  string ip = 5;
  ContainerState state = 6;
  uint64 generation = 7;
}

message ListContainersRequest {}

message ListContainersResponse {
  repeated InspectContainerResponse containers = 1;
}

message ApplyRoutesRequest {
  uint64 generation = 1;
  repeated Route routes = 2;
}

message ApplyRoutesResponse {
  bool success = 1;
  string message = 2;
}
